version: "3.9"

services:
  web:
    build: .
    command: uvicorn run_web_app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      - db

  scheduler:
    build: .
    command: python run_scheduler.py
    env_file:
      - .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
    depends_on:
      - db

  websocket:
    build: .
    command: python run_websocket.py
    env_file:
      - .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
    depends_on:
      - db

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-gptrader}
      POSTGRES_USER: ${PG_USER:-gptrader}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-gptrader}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
