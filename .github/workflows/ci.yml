name: CI

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Deploy to cloud host via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_SSH_HOST }}
          username: ${{ secrets.CLOUD_SSH_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          port: ${{ secrets.CLOUD_SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.CLOUD_APP_DIR }}
            git pull origin main
            docker compose down
            docker compose up -d --build
